# 仅部署 EasyChat 业务服务（Gateway / User / Chat）
# 中间件（MySQL、Redis、Nacos）已在宿主机或其他容器运行时使用此文件。
#
# 用法（在服务器上）：
#   cd deploy
#   cp .env.server.example .env    # 按实际修改
#   docker compose -f docker-compose.apps.yml up -d --build
#
# 本地开发：继续用 IDE + application-local.yml 连 106.54.58.197 即可，无需起此 compose。

name: easychat-apps

services:
  easychat-user:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        MODULE: easychat-user
    container_name: easychat-user
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:mysql://${REMOTE_HOST:-106.54.58.197}:${MYSQL_PORT:-3307}/easychat_user?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: ${REMOTE_HOST:-106.54.58.197}
      REDIS_PORT: ${REDIS_PORT:-6380}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      NACOS_SERVER_ADDR: ${REMOTE_HOST:-106.54.58.197}:${NACOS_PORT:-8848}
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      TENCENT_COS_SECRET_ID: ${TENCENT_COS_SECRET_ID:-}
      TENCENT_COS_SECRET_KEY: ${TENCENT_COS_SECRET_KEY:-}
      TENCENT_COS_BUCKET: ${TENCENT_COS_BUCKET:-}
      TENCENT_COS_URL_PREFIX: ${TENCENT_COS_URL_PREFIX:-}
    ports:
      - "8081:8081"

  easychat-chat:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        MODULE: easychat-chat
    container_name: easychat-chat
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:mysql://${REMOTE_HOST:-106.54.58.197}:${MYSQL_PORT:-3307}/easychat_chat?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: ${REMOTE_HOST:-106.54.58.197}
      REDIS_PORT: ${REDIS_PORT:-6380}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      NACOS_SERVER_ADDR: ${REMOTE_HOST:-106.54.58.197}:${NACOS_PORT:-8848}
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      TENCENT_COS_SECRET_ID: ${TENCENT_COS_SECRET_ID:-}
      TENCENT_COS_SECRET_KEY: ${TENCENT_COS_SECRET_KEY:-}
      TENCENT_COS_BUCKET: ${TENCENT_COS_BUCKET:-}
      TENCENT_COS_URL_PREFIX: ${TENCENT_COS_URL_PREFIX:-}
    depends_on:
      - easychat-user
    ports:
      - "8082:8082"
      - "8083:8083"

  easychat-gateway:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        MODULE: easychat-gateway
    container_name: easychat-gateway
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      NACOS_SERVER_ADDR: ${REMOTE_HOST:-106.54.58.197}:${NACOS_PORT:-8848}
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD}
    depends_on:
      - easychat-user
      - easychat-chat
    ports:
      - "8080:8080"
