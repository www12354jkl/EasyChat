server:
    port: 8080

spring:
    application:
        name: easychat-gateway
    profiles:
        active: ${SPRING_PROFILES_ACTIVE:local}
    main:
        web-application-type: reactive
    data:
        redis:
            host: ${REDIS_HOST:localhost}
            port: ${REDIS_PORT:6379}
            database: 0
            password: ${REDIS_PASSWORD:}
    cloud:
        nacos:
            discovery:
                server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
                username: ${NACOS_USERNAME:nacos}
                password: ${NACOS_PASSWORD:}
            config:
                import-check:
                    enabled: false
        gateway:
            server:
                webflux:
                    globalcors:
                        cors-configurations:
                            '[/**]':
                                allowedOriginPatterns: "*"
                                allowedMethods: "*"
                                allowedHeaders: "*"
                                allowCredentials: true
                    routes:
                        - id: easychat-user
                          uri: lb://easychat-user-service
                          predicates:
                              - Path=/api/auth/**,/api/user/**
                        - id: easychat-chat
                          uri: lb://easychat-chat-service
                          predicates:
                              - Path=/api/chat/**
                        - id: easychat-ws
                          uri: no://op
                          predicates:
                              - Path=/ws,/ws/**
                          filters:
                              - name: WsLoadBalancer
                                args:
                                    serviceId: easychat-chat-service
                        - id: user-api-docs
                          uri: lb://easychat-user-service
                          predicates:
                              - Path=/v3/api-docs/user
                          filters:
                              - SetPath=/v3/api-docs
                        - id: chat-api-docs
                          uri: lb://easychat-chat-service
                          predicates:
                              - Path=/v3/api-docs/chat
                          filters:
                              - SetPath=/v3/api-docs
        sentinel:
            transport:
                dashboard: ${SENTINEL_DASHBOARD:localhost:8858}
                port: 8719
            eager: true
            scg:
                fallback:
                    mode: response
                    response-status: 429
                    content-type: application/json
                    response-body: '{"code":429,"message":"请求过于频繁，请稍后再试"}'
            datasource:
                gw-flow-file:
                    file:
                        file: classpath:sentinel/gw-flow.json
                        data-type: json
                        rule-type: gw-flow
                gw-flow-nacos:
                    nacos:
                        server-addr: ${spring.cloud.nacos.discovery.server-addr}
                        username: ${spring.cloud.nacos.discovery.username}
                        password: ${spring.cloud.nacos.discovery.password}
                        data-id: easychat-gateway-gw-flow
                        group-id: SENTINEL_GROUP
                        data-type: json
                        rule-type: gw-flow

logging:
    pattern:
        level: "%5p [traceId=%X{traceId:-}]"
    level:
        org.springframework.cloud.gateway: INFO

jwt:
    secret: ${JWT_SECRET:change-me-in-production}

springdoc:
    api-docs:
        enabled: false
    swagger-ui:
        enabled: false
        disable-swagger-default-url: true
        persist-authorization: true
        try-it-out-enabled: true
        urls-primary-name: user
        urls:
            - name: user
              url: /v3/api-docs/user
            - name: chat
              url: /v3/api-docs/chat
