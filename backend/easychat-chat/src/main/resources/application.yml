server:
    port: 8082

ws:
    port: 8083

spring:
    application:
        name: easychat-chat-service
    profiles:
        active: ${SPRING_PROFILES_ACTIVE:local}
    datasource:
        driver-class-name: com.mysql.cj.jdbc.Driver
        url: ${DB_URL:jdbc:mysql://localhost:3306/easychat_chat?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
        username: ${DB_USERNAME:root}
        password: ${DB_PASSWORD:}
        druid:
            initial-size: 5
            min-idle: 5
            max-active: 20
            max-wait: 60000
    sql:
        init:
            mode: always
            schema-locations: classpath:schema-group-invite.sql
    data:
        redis:
            host: ${REDIS_HOST:localhost}
            port: ${REDIS_PORT:6379}
            database: 0
            password: ${REDIS_PASSWORD:}
    cloud:
        nacos:
            discovery:
                server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
                username: ${NACOS_USERNAME:nacos}
                password: ${NACOS_PASSWORD:}
            config:
                import-check:
                    enabled: false
        sentinel:
            transport:
                dashboard: ${SENTINEL_DASHBOARD:localhost:8858}
                port: 8721
            eager: true
            datasource:
                flow-file:
                    file:
                        file: classpath:sentinel/flow.json
                        data-type: json
                        rule-type: flow
                flow-nacos:
                    nacos:
                        server-addr: ${spring.cloud.nacos.discovery.server-addr}
                        username: ${spring.cloud.nacos.discovery.username}
                        password: ${spring.cloud.nacos.discovery.password}
                        data-id: easychat-chat-service-flow
                        group-id: SENTINEL_GROUP
                        data-type: json
                        rule-type: flow
    mail:
        host: smtp.qq.com
        port: 465
        username: ${MAIL_USERNAME:}
        password: ${MAIL_PASSWORD:}
        properties:
            mail:
                smtp:
                    ssl:
                        enable: true

mybatis-plus:
    mapper-locations: classpath*:/mapper/**/*.xml
    configuration:
        map-underscore-to-camel-case: true
        log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
    secret: ${JWT_SECRET:change-me-in-production}
    access-expiration: 1800000
    refresh-expiration: 604800000
    # chat 服务没有免鉴权接口（WebSocket 握手在拦截器里单独处理），保留 swagger 默认
    public-paths: /api/internal,/swagger-ui,/v3/api-docs

springdoc:
    api-docs:
        enabled: false
    swagger-ui:
        enabled: false
        persist-authorization: true
        disable-swagger-default-url: true
        try-it-out-enabled: true
    paths-to-exclude: /api/internal/**

tencent:
  cos:
    secret-id: ${TENCENT_COS_SECRET_ID:}
    secret-key: ${TENCENT_COS_SECRET_KEY:}
    region: ${TENCENT_COS_REGION:ap-guangzhou}
    bucket: ${TENCENT_COS_BUCKET:}
    url-prefix: ${TENCENT_COS_URL_PREFIX:}

ratelimit:
    enabled: true
